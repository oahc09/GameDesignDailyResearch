# 机制语义归并规则
mechanic_merge_rules:
  - "题材换皮、名称变化不新增机制，登记为既有机制的案例变体（aliases 管理）"
  - "合并机制词条时保留旧 ID 重定向、全部来源与审计记录"
  - "无法确认是否同一机制时标记 possible_duplicate，不自动覆盖"
